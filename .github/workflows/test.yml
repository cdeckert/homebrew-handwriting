name: Test formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Configure Homebrew
        run: brew update-reset
      - name: Add checkout as a tap
        run: brew tap cdeckert/handwriting "$GITHUB_WORKSPACE"
      - name: Check formula style
        run: brew style cdeckert/handwriting/handwriting-cli
      - name: Audit formula
        run: brew audit --strict cdeckert/handwriting/handwriting-cli
      - name: Install formula
        run: brew install --build-from-source cdeckert/handwriting/handwriting-cli
      - name: Test installed CLI
        run: brew test handwriting-cli
